<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/Navbar.css">
</head>
<style>
    body{
    background-image: url('../Images/crimson.jpg');
    background-size: cover;
}   
</style>
<body>
    <iframe src="Navbar.html" style="width:100%; height:150px; border:none;"></iframe>
    <div data-include="Navbar.html"></div>

    <h3 class="text-center mt-2 text-black">Contact US</h3>
    <p class="text-center form-inline ">Please follow these rules to ensure a positive experience for all users.</p>


    <div class="form container mt-4 mw-500">
        <form class = "justify-content-center">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" class="form-control mb-2" required>

            <label for="surname">Surname:</label>
            <input type="text" id="surname" name="surname" class="form-control mb-2" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" class="form-control mb-2" required>

            <label for="cars">Choose a category</label>
            <select name="cars" id="cars" class="form-control mb-2">
                    <option disabled selected value="volvo">Please select a category</option>
                    <option value="saab">Bugs</option>
                    <option value="saab">Report a user</option>
                    <option value="mercedes">Suggestion</option>
                    <option value="audi">General Inquiry</option>
            </select>

            <label for="message">Message:</label>
            <textarea id="message" name="message" class="form-control mb-2" rows="4" required></textarea>

            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
</body>

</html>
